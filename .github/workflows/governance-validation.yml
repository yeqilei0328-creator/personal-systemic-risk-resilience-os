name: Governance Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governance contract
        run: python scripts/validate_governance.py
      - name: Run governance unit tests
        run: python -m unittest tests.test_governance -v
      - name: Compile governance code
        run: python -m compileall -q src scripts tests